<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fc">
    <script>try { const theme = localStorage.getItem('theme'); if (theme) document.documentElement.dataset.theme = theme; } catch { }</script>
    <title>相机调试 · Cam Test</title>
    <style>
        :root {
            color-scheme: light dark;
            --page: light-dark(#f6f7fc, #0e1015);
            --surface: light-dark(#fff, #171922);
            --surface-2: light-dark(#eef0f8, #20232e);
            --outline: light-dark(#171a2117, #e4e2ec1a);
            --text: light-dark(#171a21, #e4e2ec);
            --muted: light-dark(#5c6272, #a3a8b8);
            --primary: light-dark(#0b57d0, #a8c7fa);
            --primary-container: light-dark(#d3e3fd, #0842a0);
            --on-primary-container: light-dark(#041e49, #d3e3fd);
            --danger: light-dark(#b3261e, #f2b8b5);
            --ok: light-dark(#146c2e, #7ddba3);
            --shadow: 0 12px 32px -16px light-dark(#1018282e, #0008);
        }
        :root[data-theme="light"] { color-scheme: light; }
        :root[data-theme="dark"] { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--text);
            background: radial-gradient(120% 70% at 80% -20%, color-mix(in srgb, var(--primary) 12%, transparent), transparent 60%), var(--page);
            font-family: system-ui, "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button, input { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(290px, 350px);
            gap: 16px;
            min-height: 100svh;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        .stream-pane, .side-panel { border: 1px solid var(--outline); border-radius: 24px; box-shadow: var(--shadow); }
        .stream-pane { position: relative; overflow: hidden; min-height: 320px; background: #0a0c10; }
        .video-placeholder { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 32px; color: #8991a5; text-align: center; }
        .video-placeholder svg { margin: auto; width: 46px; height: 46px; opacity: .65; }
        .video-placeholder p { margin: 0; font-size: 13px; }
        video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
        .stream-overlay { position: absolute; z-index: 1; top: 14px; left: 14px; right: 14px; display: flex; gap: 8px; align-items: start; }
        .stream-status, .reconnect { padding: 7px 12px; border: 1px solid #ffffff20; border-radius: 999px; background: #0a0c10a8; color: #e7e9f2; backdrop-filter: blur(10px); font-size: 12px; }
        .stream-status { display: flex; gap: 8px; align-items: center; line-height: 1.5; }
        .status-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: #fbbf24; }
        .stream-status[data-tone="live"] .status-dot { background: #34d399; box-shadow: 0 0 0 3px #34d39930; }
        .reconnect { margin-left: auto; white-space: nowrap; }
        .reconnect:hover { background: #20232ecc; }
        .side-panel { padding: 22px; background: var(--surface); align-self: start; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 14px; color: var(--on-primary-container); background: var(--primary-container); }
        .brand-mark svg { width: 24px; height: 24px; }
        h1 { margin: 0 0 4px; font-size: 19px; line-height: 1.2; }
        .subtitle { margin: 0; color: var(--muted); font-size: 12px; }
        .theme-toggle { display: grid; place-items: center; margin-left: auto; padding: 8px; border: 1px solid var(--outline); border-radius: 12px; color: var(--text); background: var(--surface-2); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .camera-state { display: flex; align-items: center; gap: 8px; margin: 24px 0 6px; font-size: 13px; font-weight: 600; }
        .camera-state .status-dot { background: var(--muted); }
        .camera-state[data-connected="true"] { color: var(--ok); }
        .camera-state[data-connected="true"] .status-dot { background: var(--ok); }
        .message { margin: 0; min-height: 38px; color: var(--muted); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
        .message[data-error="true"] { color: var(--danger); }
        .parameter { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--outline); }
        .parameter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .parameter label { font-size: 14px; font-weight: 650; }
        .desired { display: inline-flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
        .desired output { font-size: 24px; font-weight: 600; letter-spacing: -.6px; }
        .unit { color: var(--muted); font-size: 12px; }
        input[type="range"] { display: block; width: 100%; height: 32px; margin: 16px 0 4px; accent-color: var(--primary); cursor: pointer; touch-action: pan-y; }
        input[type="range"]:disabled { opacity: .35; cursor: default; }
        .range { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
        .actual-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 10px; margin-top: 15px; font-size: 12px; line-height: 1.6; }
        .actual-row > span:first-child { color: var(--muted); }
        .actual-row strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
        .feedback { color: var(--muted); overflow-wrap: anywhere; }
        .feedback[data-error="true"] { color: var(--danger); }
        .note { margin: 26px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); color: var(--muted); font-size: 12px; line-height: 1.7; }
        @media (max-width: 800px) {
            .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px; }
            .stream-pane { min-height: 0; aspect-ratio: 4 / 3; }
            .side-panel { padding: 20px; }
            .camera-state { margin-top: 20px; }
        }
        @media (min-width: 801px) { .stream-pane { min-height: calc(100svh - 32px); } }
        @media (prefers-reduced-motion: no-preference) { button { transition: background-color 150ms ease; } }
    </style>
</head>
<body>
    <main class="layout">
        <section class="stream-pane" aria-label="相机实时画面">
            <div class="video-placeholder" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="4"/></svg>
                <p>等待相机画面</p>
            </div>
            <video id="video" autoplay playsinline muted aria-label="实时视频"></video>
            <div class="stream-overlay">
                <div class="stream-status" id="stream-status" data-tone="idle" role="status"><span class="status-dot"></span><span id="stream-message">视频连接中…</span></div>
                <button class="reconnect" id="reconnect" type="button">重新连接</button>
            </div>
        </section>
        <aside class="side-panel" aria-label="相机参数">
            <header class="brand">
                <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h4l2-3h4l2 3h4v13H4z" stroke-linejoin="round"/><circle cx="12" cy="13" r="4"/></svg></div>
                <div><h1>相机调试</h1><p class="subtitle">Cam Test · 实时预览</p></div>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅主题" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5a8.5 8.5 0 1 0 10.6 10.6Z" stroke-linejoin="round"/></svg></button>
            </header>
            <div class="camera-state" id="camera-state" data-connected="false"><span class="status-dot" aria-hidden="true"></span><span id="camera-status">正在获取相机状态…</span></div>
            <p class="message" id="camera-message" role="status">连接后可调整曝光时间和增益。</p>
            <section class="parameter">
                <div class="parameter-head"><label for="exposure">曝光时间</label><div class="desired"><output id="exposure-desired" for="exposure">—</output><span class="unit">µs</span></div></div>
                <input id="exposure" type="range" min="0" max="1" step="any" value="0" disabled aria-describedby="exposure-range exposure-feedback">
                <div class="range" id="exposure-range"><span id="exposure-min">—</span><span id="exposure-max">—</span></div>
                <div class="actual-row"><span>实际值 <strong id="exposure-actual">—</strong></span><span class="feedback" id="exposure-feedback">等待相机</span></div>
            </section>
            <section class="parameter">
                <div class="parameter-head"><label for="gain">增益</label><div class="desired"><output id="gain-desired" for="gain">—</output><span class="unit">dB</span></div></div>
                <input id="gain" type="range" min="0" max="1" step="any" value="0" disabled aria-describedby="gain-range gain-feedback">
                <div class="range" id="gain-range"><span id="gain-min">—</span><span id="gain-max">—</span></div>
                <div class="actual-row"><span>实际值 <strong id="gain-actual">—</strong></span><span class="feedback" id="gain-feedback">等待相机</span></div>
            </section>
            <p class="note">点击滑块后，↑/→ 增加、↓/← 减少；曝光每次微调 1 µs，增益每次微调 0.02 dB。按住 0.4 秒后加速：每 0.1 秒调整曝光 100 µs 或增益 1 dB，松键停止。曝光滑块上限为 5000 µs，实际值以相机回读为准。参数在本次运行中保留；程序重启后使用启动参数。</p>
        </aside>
    </main>
    <script>
        const $ = (id) => document.getElementById(id);
        const video = $('video');
        let stopped = false;

        const systemDark = matchMedia('(prefers-color-scheme: dark)');
        function storedTheme() { try { return localStorage.getItem('theme'); } catch { return null; } }
        function applyTheme(theme) {
            if (theme) document.documentElement.dataset.theme = theme;
            else delete document.documentElement.dataset.theme;
            const dark = theme ? theme === 'dark' : systemDark.matches;
            $('theme-toggle').setAttribute('aria-pressed', String(dark));
            document.querySelector('meta[name="theme-color"]').content = dark ? '#0e1015' : '#f6f7fc';
        }
        const onSystemTheme = () => applyTheme(storedTheme());
        systemDark.addEventListener('change', onSystemTheme);
        $('theme-toggle').addEventListener('click', () => {
            const theme = $('theme-toggle').getAttribute('aria-pressed') === 'true' ? 'light' : 'dark';
            try { localStorage.setItem('theme', theme); } catch { }
            applyTheme(theme);
        });
        applyTheme(storedTheme());

        // A single control request is allowed in flight; each parameter keeps its latest intent.
        const fields = new Map([
            ['exposure_us', { id: 'exposure', unit: 'µs', name: '曝光时间', keyStep: 1, holdStep: 100 }],
            ['gain', { id: 'gain', unit: 'dB', name: '增益', keyStep: 0.02, holdStep: 1 }],
        ]);
        for (const field of fields.values()) {
            Object.assign(field, { input: $(field.id), actual: null, pending: null, dragging: false, error: '', confirmed: false });
        }
        let connected = false;
        let cameraPid = null;
        let inFlight = null;
        let controlTimer = null;
        let lastSentAt = -Infinity;
        let nextIntent = 0;
        let revision = 0;
        let pollController = null;
        let controlController = null;
        let keyHold = null;

        function validParameter(value) {
            return value && [value.value, value.min, value.max].every(Number.isFinite)
                && value.min <= value.max && value.value >= value.min && value.value <= value.max;
        }
        function formatValue(value, parameter) {
            return value.toLocaleString('zh-CN', { maximumFractionDigits: parameter === 'gain' ? 2 : 3 });
        }
        function controlRange(parameter, actual) {
            if (!actual) return null;
            const max = parameter === 'exposure_us' ? Math.min(actual.max, 5000) : actual.max;
            return actual.min <= max ? { min: actual.min, max } : null;
        }
        function renderControls() {
            for (const [parameter, field] of fields) {
                const actual = field.actual;
                const range = controlRange(parameter, actual);
                const busy = field.dragging || field.pending || inFlight?.parameter === parameter
                    || keyHold?.parameter === parameter;
                field.input.disabled = !connected || !range || range.min === range.max;
                if (actual) {
                    $(field.id + '-actual').textContent = formatValue(actual.value, parameter) + ' ' + field.unit;
                    if (range) {
                        field.input.min = String(range.min);
                        field.input.max = String(range.max);
                        if (!busy) field.input.value = String(Math.min(range.max, Math.max(range.min, actual.value)));
                        $(field.id + '-desired').textContent = formatValue(Number(field.input.value), parameter);
                        $(field.id + '-min').textContent = formatValue(range.min, parameter) + ' ' + field.unit;
                        $(field.id + '-max').textContent = formatValue(range.max, parameter) + ' ' + field.unit;
                    } else {
                        for (const suffix of ['-desired', '-min', '-max']) $(field.id + suffix).textContent = '—';
                    }
                } else {
                    for (const suffix of ['-desired', '-actual', '-min', '-max']) $(field.id + suffix).textContent = '—';
                }
                const feedback = $(field.id + '-feedback');
                let text = !connected ? '等待相机' : !actual ? '参数不可用' : !range ? '无可用调整范围' : range.min === range.max ? '固定值' : '拖动调整';
                if (field.confirmed) text = '已应用';
                if (inFlight?.parameter === parameter) text = '正在应用…';
                if (field.pending) text = '新值待应用…';
                if (field.error) text = field.error + (field.pending ? '；新值待应用' : '');
                feedback.textContent = text;
                feedback.dataset.error = String(Boolean(field.error));
            }
        }
        function clearPending() {
            stopKeyboardAdjustment();
            clearTimeout(controlTimer);
            controlTimer = null;
            for (const field of fields.values()) {
                field.pending = null;
                field.dragging = false;
                field.confirmed = false;
                field.error = '';
            }
        }
        function applyCamera(camera, fallbackError = '') {
            const newPid = camera?.pid ?? null;
            if (!camera?.connected || (cameraPid !== null && cameraPid !== newPid)) clearPending();
            cameraPid = newPid;
            connected = Boolean(camera?.connected);
            for (const [parameter, field] of fields) field.actual = validParameter(camera?.[parameter]) ? camera[parameter] : null;
            $('camera-state').dataset.connected = String(connected);
            $('camera-status').textContent = connected ? '相机已连接' : '相机未连接';
            const error = fallbackError || camera?.error || '';
            $('camera-message').textContent = error || (connected ? '自由采集 · 手动曝光与增益' : '等待 cam_test 启动或相机重新连接。');
            $('camera-message').dataset.error = String(Boolean(error));
            renderControls();
        }
        function queueValue(parameter, preservePrecision = false) {
            const field = fields.get(parameter);
            if (stopped || !connected || field.input.disabled || !field.actual) return;
            const raw = Number(field.input.value);
            const range = controlRange(parameter, field.actual);
            if (!range) return;
            const { min, max } = range;
            // Preserve exact endpoints, including devices whose minimum exposure is fractional.
            const rounded = preservePrecision ? raw : parameter === 'exposure_us' ? Math.round(raw) : Math.round(raw * 100) / 100;
            const value = raw <= min ? min : raw >= max ? max : Math.min(max, Math.max(min, rounded));
            field.input.value = String(value);
            revision++;
            field.confirmed = false;
            field.error = '';
            if (inFlight?.parameter === parameter && inFlight.value === value) field.pending = null;
            else if (field.pending?.value !== value) field.pending = { value, order: ++nextIntent };
            renderControls();
            scheduleControl();
        }
        function scheduleControl() {
            if (stopped || !connected || inFlight || controlTimer !== null) return;
            if (![...fields.values()].some((field) => field.pending)) return;
            controlTimer = setTimeout(() => {
                controlTimer = null;
                sendControl();
            }, Math.max(0, 100 - (performance.now() - lastSentAt)));
        }
        async function sendControl() {
            if (stopped || !connected || inFlight) return;
            const entry = [...fields].filter(([, field]) => field.pending)
                .sort((a, b) => a[1].pending.order - b[1].pending.order)[0];
            if (!entry) return;
            const [parameter, field] = entry;
            const request = { parameter, value: field.pending.value };
            field.pending = null;
            inFlight = request;
            lastSentAt = performance.now();
            revision++;
            renderControls();
            const controller = new AbortController();
            controlController = controller;
            const timeout = setTimeout(() => controller.abort(), 4000);
            try {
                const response = await fetch('/api/camera', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request), signal: controller.signal,
                });
                const result = await response.json();
                if (stopped) return;
                revision++;
                const unavailable = response.status === 503 || response.status === 504;
                applyCamera(unavailable && result.camera ? { ...result.camera, connected: false } : result.camera ?? null);
                if (!response.ok || result.status !== 'ok') {
                    const message = result.message || `设置失败（HTTP ${response.status}）`;
                    field.error = message;
                    $('camera-message').textContent = field.name + '：' + message;
                    $('camera-message').dataset.error = 'true';
                } else {
                    field.error = '';
                    field.confirmed = true;
                }
            } catch (error) {
                if (stopped) return;
                revision++;
                const message = error.name === 'AbortError' ? '请求超时，正在重新获取相机状态。' : '无法连接相机控制服务，正在重试。';
                applyCamera(null, message);
                field.error = message;
            } finally {
                clearTimeout(timeout);
                if (controlController === controller) controlController = null;
                if (inFlight === request) inFlight = null;
                if (!stopped) { renderControls(); scheduleControl(); }
            }
        }
        function stopKeyboardAdjustment() {
            if (!keyHold) return;
            clearTimeout(keyHold.delayTimer);
            clearInterval(keyHold.repeatTimer);
            keyHold = null;
            if (!stopped) renderControls();
        }
        function adjustByKey(parameter, direction, step) {
            const field = fields.get(parameter);
            if (stopped || !connected || field.input.disabled || document.hidden
                || document.activeElement !== field.input) return false;
            const range = controlRange(parameter, field.actual);
            if (!range) return false;
            const current = Number(field.input.value);
            const next = Math.min(range.max, Math.max(range.min, current + direction * step));
            if (next === current) return false;
            field.input.value = String(next);
            queueValue(parameter, true);
            return true;
        }
        for (const [parameter, field] of fields) {
            field.input.addEventListener('pointerdown', () => {
                stopKeyboardAdjustment();
                field.input.focus({ preventScroll: true });
                field.dragging = true;
                revision++;
            });
            field.input.addEventListener('input', () => queueValue(parameter));
            field.input.addEventListener('keydown', (event) => {
                const direction = event.key === 'ArrowUp' || event.key === 'ArrowRight' ? 1
                    : event.key === 'ArrowDown' || event.key === 'ArrowLeft' ? -1 : 0;
                if (!direction) return;
                event.preventDefault();
                // A fixed timer controls acceleration, independently of OS key-repeat settings.
                if (event.repeat) return;
                stopKeyboardAdjustment();
                const hold = { parameter, key: event.key, delayTimer: null, repeatTimer: null };
                keyHold = hold;
                if (!adjustByKey(parameter, direction, field.keyStep)) {
                    stopKeyboardAdjustment();
                    return;
                }
                hold.delayTimer = setTimeout(() => {
                    if (keyHold !== hold) return;
                    const repeat = () => {
                        if (keyHold === hold && !adjustByKey(parameter, direction, field.holdStep)) {
                            stopKeyboardAdjustment();
                        }
                    };
                    repeat();
                    if (keyHold === hold) hold.repeatTimer = setInterval(repeat, 100);
                }, 400);
            });
            field.input.addEventListener('change', () => { field.dragging = false; queueValue(parameter); });
            field.input.addEventListener('blur', () => {
                if (keyHold?.parameter === parameter) stopKeyboardAdjustment();
                if (field.dragging) { field.dragging = false; queueValue(parameter); }
            });
        }
        const finishDragging = () => {
            for (const [parameter, field] of fields) {
                if (field.dragging) { field.dragging = false; queueValue(parameter); }
            }
        };
        window.addEventListener('pointerup', finishDragging);
        window.addEventListener('pointercancel', finishDragging);
        const releaseKeyboard = (event) => {
            if (keyHold?.key === event.key) stopKeyboardAdjustment();
        };
        const hideKeyboard = () => { if (document.hidden) stopKeyboardAdjustment(); };
        window.addEventListener('keyup', releaseKeyboard);
        window.addEventListener('blur', stopKeyboardAdjustment);
        document.addEventListener('visibilitychange', hideKeyboard);
        async function pollCamera() {
            if (stopped || pollController || inFlight) return;
            const controller = new AbortController();
            pollController = controller;
            const startedRevision = revision;
            const timeout = setTimeout(() => controller.abort(), 3000);
            try {
                const response = await fetch('/api/context', { cache: 'no-store', signal: controller.signal });
                const result = await response.json();
                if (stopped || startedRevision !== revision) return;
                if (!response.ok) {
                    applyCamera(result.camera ? { ...result.camera, connected: false } : null, result.message || `HTTP ${response.status}`);
                    return;
                }
                applyCamera(result.camera ?? null, result.camera ? '' : result.message || '等待 cam_test 启动。');
            } catch {
                if (!stopped && startedRevision === revision) applyCamera(null, '无法获取相机状态，正在重试。');
            } finally {
                clearTimeout(timeout);
                if (pollController === controller) pollController = null;
            }
        }

        // The independent MediaMTX instance serves this page's WHEP session on port 8891.
        const whepUrl = new URL('/cam_test/whep', window.location.href);
        whepUrl.protocol = 'http:';
        whepUrl.port = '8891';
        let peerConnection = null;
        let sessionUrl = null;
        let streamController = null;
        let retryTimer = null;
        let iceWaitCancel = null;
        let handshakeTimer = null;
        let frameCallback = null;
        let streamGeneration = 0;
        let connectAttempts = 0;
        let lastFrameAt = 0;
        let lastPlaybackTime = 0;
        function streamStatus(message, tone = 'idle') {
            $('stream-message').textContent = message;
            $('stream-status').dataset.tone = tone;
        }
        function deleteSession(url, keepalive = false) {
            if (url) fetch(url, { method: 'DELETE', keepalive }).catch(() => {});
        }
        function cleanupStream(keepalive = false) {
            clearTimeout(retryTimer);
            clearTimeout(handshakeTimer);
            retryTimer = handshakeTimer = null;
            streamController?.abort();
            streamController = null;
            iceWaitCancel?.();
            iceWaitCancel = null;
            if (frameCallback !== null && typeof video.cancelVideoFrameCallback === 'function') video.cancelVideoFrameCallback(frameCallback);
            frameCallback = null;
            if (peerConnection) {
                peerConnection.ontrack = null;
                peerConnection.onconnectionstatechange = null;
                peerConnection.onicecandidate = null;
                peerConnection.close();
                peerConnection = null;
            }
            video.srcObject = null;
            deleteSession(sessionUrl, keepalive);
            sessionUrl = null;
        }
        function waitForIce(peer) {
            if (peer.iceGatheringState === 'complete') return Promise.resolve();
            return new Promise((resolve) => {
                const finish = () => {
                    clearTimeout(timer);
                    peer.removeEventListener('icegatheringstatechange', onChange);
                    if (iceWaitCancel === finish) iceWaitCancel = null;
                    resolve();
                };
                const onChange = () => { if (peer.iceGatheringState === 'complete') finish(); };
                const timer = setTimeout(finish, 150);
                iceWaitCancel = finish;
                peer.addEventListener('icegatheringstatechange', onChange);
            });
        }
        function scheduleReconnect(immediate = false) {
            if (stopped || retryTimer !== null) return;
            streamStatus('视频连接中断，正在重试…');
            const delay = immediate ? 0 : Math.min(200 * 2 ** Math.min(connectAttempts++, 5), 4000);
            retryTimer = setTimeout(() => { retryTimer = null; connectStream(); }, delay);
        }
        function watchFrames(peer) {
            if (typeof video.requestVideoFrameCallback !== 'function') return;
            frameCallback = video.requestVideoFrameCallback(() => {
                frameCallback = null;
                if (stopped || peer !== peerConnection) return;
                lastFrameAt = performance.now();
                connectAttempts = 0;
                streamStatus('实时画面', 'live');
                watchFrames(peer);
            });
        }
        function iceFragment(peer, candidate) {
            const lines = peer.localDescription?.sdp.split('\r\n') || [];
            return [lines.find((line) => line.startsWith('a=ice-ufrag:')),
                lines.find((line) => line.startsWith('a=ice-pwd:')),
                lines.find((line) => line.startsWith('m=video ')),
                'a=mid:' + (candidate.sdpMid ?? '0'), 'a=' + candidate.candidate,
            ].filter(Boolean).join('\r\n') + '\r\n';
        }
        function patchCandidate(url, peer, candidate) {
            fetch(url, { method: 'PATCH', headers: { 'Content-Type': 'application/trickle-ice-sdpfrag', 'If-Match': '*' }, body: iceFragment(peer, candidate) }).catch(() => {});
        }
        async function connectStream() {
            const generation = ++streamGeneration;
            cleanupStream();
            if (stopped) return;
            streamStatus('视频连接中…');
            if (typeof RTCPeerConnection === 'undefined') { streamStatus('此浏览器不支持 WebRTC'); return; }
            const peer = new RTCPeerConnection({ iceServers: [] });
            peerConnection = peer;
            const current = () => !stopped && generation === streamGeneration && peer === peerConnection;
            const candidates = [];
            let activeSession = null;
            lastFrameAt = performance.now();
            lastPlaybackTime = video.currentTime;
            peer.addTransceiver('video', { direction: 'recvonly' });
            peer.onicecandidate = (event) => {
                if (!current() || !event.candidate) return;
                if (activeSession) patchCandidate(activeSession, peer, event.candidate);
                else candidates.push(event.candidate);
            };
            peer.ontrack = (event) => {
                if (!current()) return;
                video.srcObject = event.streams[0] || new MediaStream([event.track]);
                event.track.onended = () => { if (current()) scheduleReconnect(); };
                video.play().catch(() => { if (current()) streamStatus('点击画面开始播放'); });
                lastFrameAt = performance.now();
                streamStatus('正在接收画面…');
                watchFrames(peer);
            };
            peer.onconnectionstatechange = () => {
                if (current() && ['failed', 'closed', 'disconnected'].includes(peer.connectionState)) scheduleReconnect(peer.connectionState === 'disconnected');
            };
            const controller = new AbortController();
            streamController = controller;
            handshakeTimer = setTimeout(() => controller.abort(), 6000);
            try {
                const offer = await peer.createOffer();
                if (!current()) return;
                await peer.setLocalDescription(offer);
                if (!current()) return;
                await waitForIce(peer);
                if (!current()) return;
                const response = await fetch(whepUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/sdp' },
                    body: peer.localDescription.sdp, signal: controller.signal,
                });
                if (response.status !== 201) throw new Error(`HTTP ${response.status}`);
                const location = response.headers.get('location');
                if (!location) throw new Error('缺少 WHEP 会话地址');
                const createdSession = new URL(location, whepUrl).toString();
                if (!current()) { deleteSession(createdSession); return; }
                sessionUrl = activeSession = createdSession;
                for (const candidate of candidates) patchCandidate(activeSession, peer, candidate);
                candidates.length = 0;
                const answer = await response.text();
                if (!current()) return;
                await peer.setRemoteDescription({ type: 'answer', sdp: answer });
            } catch {
                if (current()) scheduleReconnect();
            } finally {
                if (current()) {
                    clearTimeout(handshakeTimer);
                    handshakeTimer = null;
                    if (streamController === controller) streamController = null;
                }
            }
        }
        $('reconnect').addEventListener('click', () => { connectAttempts = 0; connectStream(); });
        video.addEventListener('click', () => { if (video.srcObject) video.play().catch(() => {}); });
        const frameInterval = setInterval(() => {
            if (stopped || retryTimer !== null || !peerConnection) return;
            if (typeof video.requestVideoFrameCallback !== 'function' && video.currentTime !== lastPlaybackTime) {
                lastPlaybackTime = video.currentTime;
                lastFrameAt = performance.now();
                connectAttempts = 0;
                streamStatus('实时画面', 'live');
            }
            if (performance.now() - lastFrameAt > 10000) scheduleReconnect(true);
        }, 500);
        const pollInterval = setInterval(pollCamera, 1000);
        function shutdown() {
            if (stopped) return;
            stopped = true;
            streamGeneration++;
            clearInterval(frameInterval);
            clearInterval(pollInterval);
            clearPending();
            pollController?.abort();
            controlController?.abort();
            systemDark.removeEventListener('change', onSystemTheme);
            window.removeEventListener('pointerup', finishDragging);
            window.removeEventListener('pointercancel', finishDragging);
            window.removeEventListener('keyup', releaseKeyboard);
            window.removeEventListener('blur', stopKeyboardAdjustment);
            document.removeEventListener('visibilitychange', hideKeyboard);
            cleanupStream(true);
        }
        window.addEventListener('pagehide', shutdown);
        window.addEventListener('beforeunload', shutdown);
        // A restored back/forward-cache page needs fresh timers and device state.
        window.addEventListener('pageshow', (event) => { if (event.persisted && stopped) window.location.reload(); });
        pollCamera();
        connectStream();
    </script>
</body>
</html>
