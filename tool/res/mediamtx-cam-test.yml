# Independent cam_test gateway. The normal autoaim gateway can remain running.
api: false
metrics: false
pprof: false
playback: false
rtsp: false
rtmp: false
hls: false
srt: false
webrtc: true
webrtcAddress: :8891
webrtcLocalUDPAddress: :8190
webrtcLocalTCPAddress: ''
webrtcAllowOrigins: ['*']

paths:
  cam_test:
    source: udp+rtp://127.0.0.1:5001
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=cam_test
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5001 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
